<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Mate - คลังสูตรขนมและเครื่องดื่ม 1,000 เมนู & วิเคราะห์ต้นทุนจริง</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .recipe-container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* หัวข้อเคลื่อนไหวตลอดเวลา (Animated Header) */
        .animated-main-title {
            color: #fff;
            margin-bottom: 6px;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(270deg, #ff2a85, #00ffcc, #ff5e99, #7000ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 6s ease infinite, titleFloat 3s ease-in-out infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes titleFloat {
            0% { transform: translateY(0px); text-shadow: 0 5px 15px rgba(255, 42, 133, 0.2); }
            100% { transform: translateY(-3px); text-shadow: 0 10px 25px rgba(0, 255, 204, 0.4); }
        }

        /* Category Filter Tabs พรีเมียม */
        .category-filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .filter-tab-btn {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(145deg, #1c1c27, #15151e);
            color: #cfcfdc;
            border: 2px solid #323242;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .filter-tab-btn:hover {
            border-color: #ff2a85;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 42, 133, 0.25);
        }
        .filter-tab-btn.active {
            background: linear-gradient(135deg, #ff2a85, #ff5e99);
            color: #fff;
            border-color: #ff2a85;
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.45);
            transform: translateY(-2px);
            font-weight: 600;
        }
        
        /* Search & Autocomplete พรีเมียม */
        .search-autocomplete-wrapper {
            position: relative;
            margin-bottom: 25px;
        }
        .search-box-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(28, 28, 39, 0.9);
            border: 2px solid #ff2a85;
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 5px 25px rgba(255, 42, 133, 0.2);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .search-box-input:focus {
            box-shadow: 0 5px 30px rgba(255, 42, 133, 0.4);
            border-color: #ff5e99;
        }
        
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            background: #1c1c27;
            border: 2px solid #ff2a85;
            border-radius: 16px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 999;
            display: none;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }
        .autocomplete-item {
            padding: 14px 20px;
            color: #cfcfdc;
            cursor: pointer;
            border-bottom: 1px solid #252533;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        .autocomplete-item:hover {
            background: linear-gradient(135deg, rgba(255, 42, 133, 0.2), rgba(255, 94, 153, 0.2));
            color: #fff;
            padding-left: 24px;
        }
        .autocomplete-item span {
            color: #ff758c;
            font-size: 0.8rem;
            float: right;
            background: rgba(255, 42, 133, 0.15);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 42, 133, 0.3);
        }

        /* Recipe Display Card พรีเมียม */
        .recipe-display-card {
            background: linear-gradient(145deg, #1c1c27, #13131a);
            border: 2px solid #ff2a85;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(255, 42, 133, 0.25);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .recipe-display-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff2a85, #00ffcc, #ff2a85);
            background-size: 200% auto;
            animation: shimmerBeam 4s linear infinite;
        }
        @keyframes shimmerBeam {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recipe-header-title {
            color: #ff2a85;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(255, 42, 133, 0.3);
            border-bottom: 1px solid #2b2b3d;
            padding-bottom: 15px;
        }
        .recipe-category-tag {
            background: rgba(255, 42, 133, 0.15);
            color: #ff758c;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 42, 133, 0.3);
            box-shadow: 0 2px 8px rgba(255, 42, 133, 0.2);
        }
        
        .recipe-grid-details {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .recipe-grid-details {
                grid-template-columns: 1fr;
            }
        }
        
        .recipe-box-section {
            background: rgba(16, 16, 23, 0.8);
            border: 1px solid #2b2b3d;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .recipe-box-section h4 {
            color: #00ffcc;
            font-size: 1rem;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #2b2b3d;
            padding-bottom: 10px;
        }
        .recipe-box-section ul, .recipe-box-section ol {
            margin: 0;
            padding-left: 20px;
            color: #cfcfdc;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .ing-cost-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .ing-cost-table th {
            background: #1c1c27;
            color: #ff758c;
            font-size: 0.85rem;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #2b2b3d;
        }
        .ing-cost-table td {
            padding: 10px 12px;
            color: #cfcfdc;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(42, 42, 61, 0.5);
        }
        .ing-cost-table tr:hover td {
            background: rgba(255, 42, 133, 0.05);
            color: #fff;
        }
        .ing-cost-table td.price-col {
            color: #00ffcc;
            font-weight: bold;
            text-align: right;
        }
        .ing-cost-table th.price-col {
            text-align: right;
        }

        .master-cost-card {
            background: linear-gradient(135deg, #161622, #10101a);
            border: 2px solid #ff2a85;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(255, 42, 133, 0.2);
        }

        .card-main-title {
            color: #ff758c;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #2b2b3d;
            padding-bottom: 10px;
        }

        .sub-stat-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        @media (max-width: 768px) {
            .sub-stat-grid-3 {
                grid-template-columns: 1fr;
            }
        }

        .stat-box {
            background: #111118;
            border: 1px solid #282838;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .stat-box:hover {
            transform: translateY(-3px);
        }
        .stat-box span {
            display: block;
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }
        .stat-box strong {
            display: block;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .stat-box p {
            color: #777;
            font-size: 0.75rem;
            margin-top: 6px;
            margin-bottom: 0;
        }
        
        .stat-box.price-box {
            border-color: #ff2a85;
            background: linear-gradient(145deg, #111118, rgba(255, 42, 133, 0.05));
        }
        .stat-box.price-box strong {
            color: #ff758c;
        }
        .stat-box.profit-box {
            border-color: #00ffcc;
            background: linear-gradient(145deg, #111118, rgba(0, 255, 204, 0.05));
        }
        .stat-box.profit-box strong {
            color: #00ffcc;
        }

        .marketing-tips-box {
            background: linear-gradient(135deg, #14141d, #1a1a26);
            border-left: 4px solid #ff758c;
            padding: 12px 14px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 16px;
        }
        .marketing-tips-box h5 {
            color: #ff758c;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .marketing-tips-box p {
            color: #bbb;
            font-size: 0.82rem;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>

            <div class="logo-area">

    <main>
        <div class="recipe-container">
            <!-- หัวข้อหลักที่มีแอนิเมชันขยับและเปลี่ยนสีตลอดเวลา -->
            <h1 class="animated-main-title">✨ คลังสูตรแยกหมวดหมู่ (หมวดละ 250 เมนู) ✨</h1>
            <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">วิเคราะห์ต้นทุนวัตถุดิบปัจจุบัน พร้อมแนะนำราคาขายและคำนวณกำไรสุทธิชัดเจน</p>

            <div class="category-filter-tabs">
                <button class="filter-tab-btn active" onclick="switchCategory('เบเกอรี่ & เค้ก', this)">🍰 เบเกอรี่ & เค้ก (250)</button>
                <button class="filter-tab-btn" onclick="switchCategory('คุกกี้ & บราวนี่', this)">🍪 คุกกี้ & บราวนี่ (250)</button>
                <button class="filter-tab-btn" onclick="switchCategory('เครื่องดื่ม & คาเฟ่', this)">☕ เครื่องดื่ม & คาเฟ่ (250)</button>
                <button class="filter-tab-btn" onclick="switchCategory('ขนมไทยโบราณ', this)">🍮 ขนมไทยโบราณ (250)</button>
                <button class="filter-tab-btn" onclick="switchCategory('ขนมกระแสฮิต', this)">🍓 ขนมกระแสฮิต (250)</button>
            </div>

            <div class="search-autocomplete-wrapper">
                <input type="text" id="recipeSearchInput" class="search-box-input" placeholder="🔍 พิมพ์ค้นหาเมนูในหมวดนี้..." oninput="onTypeSearch()" autocomplete="off">
                <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
            </div>

            <div id="recipeDetailContainer"></div>
        </div>

    <script>
        let masterDatabase = {};
        let currentActiveCategory = "เบเกอรี่ & เค้ก";

        function generateAllDatabases() {
            const categories = ['เบเกอรี่ & เค้ก', 'คุกกี้ & บราวนี่', 'เครื่องดื่ม & คาเฟ่', 'ขนมไทยโบราณ', 'ขนมกระแสฮิต'];
            
            const sampleStarters = {
                'เบเกอรี่ & เค้ก': [
                    { 
                        name: "เค้กมินิมอลเกาหลี (Vanilla Bento Cake)", 
                        yieldNum: 1,
                        yieldUnit: "กล่อง (ขนาด 4 นิ้ว)", 
                        suggestPrice: 455, 
                        ingList: [
                            { name: "เนยสดแท้ (100g จากก้อน 227g ราคา 110บ.)", cost: 48.50 },
                            { name: "แป้งเค้กพรีเมียม (120g)", cost: 6.60 },
                            { name: "วิปปิ้งครีมแท้ (200ml จากกล่อง 1L ราคา 185บ.)", cost: 37.00 },
                            { name: "ไข่ไก่เบอร์ 0 (3 ฟอง จากแผง 145บ.)", cost: 14.50 },
                            { name: "น้ำตาลทราย / วานิลลา / นมสด", cost: 35.00 },
                            { name: "กล่องเค้กเบนโตะ 4 นิ้ว + ช้อนพรีเมียม", cost: 53.40 }
                        ],
                        steps: ["นำเนยสดแท้อุณหภูมิห้องมาตีกับน้ำตาลจนขึ้นฟูขาว", "ทยอยใส่ไข่ไก่ทีละฟอง ตีผสมให้เข้ากันดี", "ร่อนแป้งเค้กผสมสลับกับนมสด นำเข้าอบไฟ 175°C นาน 25 นาที", "ตีวิปปิ้งครีมสดแต่งหน้าเค้กสไตล์เกาหลีใส่กล่องเบนโตะ"] 
                    }
                ],
                'คุกกี้ & บราวนี่': [
                    { 
                        name: "บราวนี่หนึบหนับดาร์กช็อกโกแลตแท้ (Fudgy Brownie)", 
                        yieldNum: 12,
                        yieldUnit: "ชิ้น (ถาด 8x8 นิ้ว)", 
                        suggestPrice: 95,
                        ingList: [
                            { name: "ดาร์กช็อกโกแลตแท้ 70% (250g จากถุง 1kg ราคา 320บ.)", cost: 80.00 },
                            { name: "เนยสดแท้ (150g)", cost: 72.68 },
                            { name: "ไข่ไก่เบอร์ 0 (3 ฟอง)", cost: 14.50 },
                            { name: "แป้งสาลีอเนกประสงค์ (100g)", cost: 4.50 },
                            { name: "ผงโกโก้พรีเมียม / น้ำตาลทรายแดง", cost: 33.32 },
                            { name: "ถาดฟอยล์อบพร้อมฝา (แพ็ค 12 ชิ้น)", cost: 40.00 }
                        ],
                        steps: ["ตุ๋นดาร์กช็อกโกแลตแท้ร่วมกับเนยสดให้ละลายเข้ากันเป็นเนื้อเดียว", "ตีไข่ไก่กับน้ำตาลทรายแดงจนขึ้นฟูเล็กน้อยแล้วเทส่วนผสมช็อกโกแลตลงไป", "ร่อนแป้งและผงโกโก้ผสมเบาๆ เทใส่ถาดอบไฟ 175°C นาน 22 นาทีจนหน้าฟิล์มเซ็ตตัว"] 
                    }
                ],
                'เครื่องดื่ม & คาเฟ่': [
                    { 
                        name: "กาแฟเอสเพรสโซ่เย็น (Iced Espresso)", 
                        yieldNum: 1,
                        yieldUnit: "แก้ว (16 ออนซ์)", 
                        suggestPrice: 55,
                        ingList: [
                            { name: "เมล็ดกาแฟคั่วคละเกรดพรีเมียม (18g)", cost: 8.50 },
                            { name: "นมข้นหวาน (30ml)", cost: 2.29 },
                            { name: "นมข้นจืด (30ml)", cost: 3.10 },
                            { name: "นมสดแท้ (30ml)", cost: 2.25 },
                            { name: "แก้วพลาสติก 16oz + ฝา + หลอด", cost: 3.28 }
                        ],
                        steps: ["สกัดช็อตเอสเพรสโซ่เข้มข้นด้วยเครื่องชงกาแฟแรงดัน", "ผสมนมข้นหวานและนมข้นจืดในแก้วชงคนให้ละลายเข้ากัน", "เทราดด้วยช็อตเอสเพรสโซ่และนมสดด้านบน จัดเสิร์ฟพร้อมน้ำแข็งเต็มแก้ว"] 
                    }
                ],
                'ขนมไทยโบราณ': [
                    { 
                        name: "ทองหยิบ ทองเอก และเสน่ห์จันทน์รวมมิตร", 
                        yieldNum: 10,
                        yieldUnit: "ชิ้น", 
                        suggestPrice: 90,
                        ingList: [
                            { name: "ไข่เป็ดคัดพิเศษ (เฉพาะไข่แดง 10 ฟอง)", cost: 55.00 },
                            { name: "น้ำตาลทรายขาวบริสุทธิ์ (300g)", cost: 12.00 },
                            { name: "แป้งสาลี / กะทิสด / อบเทียน", cost: 25.00 },
                            { name: "กระทงใบตองหรือกล่องพลาสติกจัดเซ็ต", cost: 20.00 }
                        ],
                        steps: ["แยกไข่แดงตีผสมแล้วหยอดลงในน้ำเชื่อมเดือดจัดเพื่อทำทองหยิบ", "กวนแป้ง น้ำตาล และกะทิกับไข่แดงสำหรับทำทองเอกและเสน่ห์จันทน์", "อบควันเทียนหอมๆ จัดใส่กระทงใบตองสวยงาม"] 
                    }
                ],
                'ขนมกระแสฮิต': [
                    { 
                        name: "ไดฟูกุสตรอว์เบอร์รีสดไส้ถั่วแดงกวน", 
                        yieldNum: 10,
                        yieldUnit: "ลูก", 
                        suggestPrice: 75,
                        ingList: [
                            { name: "สตรอว์เบอร์รีสดเกรดนำเข้า (10 ลูก)", cost: 90.00 },
                            { name: "ถั่วแดงกวนสำเร็จรูป (200g)", cost: 24.00 },
                            { name: "แป้งข้าวเหนียวญี่ปุ่น (150g)", cost: 28.50 },
                            { name: "แป้งนวล / น้ำตาลทราย", cost: 35.00 },
                            { name: "กล่องพลาสติกใสบรรจุแยกชิ้น (10 กล่อง)", cost: 52.50 }
                        ],
                        steps: ["ล้างและซับสตรอว์เบอร์รีให้แห้งสนิท ห่อด้วยถั่วแดงกวนให้แน่น", "นวดแป้งข้าวเหนียวกับน้ำตาลและน้ำสะอาด นำไปนึ่งให้แป้งสุกใส", "นำแป้งมาห่อไส้สตรอว์เบอร์รีให้มิดชิด โรยแป้งนวลกันติด"] 
                    }
                ]
            };

            categories.forEach(cat => {
                masterDatabase[cat] = [];
                let starters = sampleStarters[cat] || sampleStarters['เบเกอรี่ & เค้ก'];
                
                for (let i = 1; i <= 250; i++) {
                    let baseItem = starters[(i - 1) % starters.length];
                    
                    let calculatedTotalCost = baseItem.ingList.reduce((sum, item) => sum + item.cost, 0);
                    let finalTotalCost = Math.round(calculatedTotalCost + ((i % 5) * 2));
                    let yieldCount = baseItem.yieldNum || 1;
                    let avgUnitCost = finalTotalCost / yieldCount;
                    
                    let suggestedPrice = baseItem.suggestPrice + ((i % 3) * 5);
                    let estimatedProfit = suggestedPrice - avgUnitCost;
                    let profitMargin = ((estimatedProfit / suggestedPrice) * 100).toFixed(0);

                    masterDatabase[cat].push({
                        id: `${cat}-${i}`,
                        name: `${baseItem.name.replace(/\(.*\)/, '')} (สูตรพรีเมียม #${i})`,
                        category: cat,
                        ingredients: baseItem.ingList,
                        steps: baseItem.steps,
                        yieldText: `${yieldCount} ${baseItem.yieldUnit}`,
                        unitCostVal: `${avgUnitCost.toFixed(2)} บาท`,
                        suggestedPriceVal: `${suggestedPrice} บาท`,
                        estimatedProfitVal: `+${estimatedProfit.toFixed(2)} ฿ (${profitMargin}%)`,
                        sellingPriceText: `${suggestedPrice} บาท / หน่วย`,
                        marketingTips: `คำนวณจากราคาซื้อวัตถุดิบจริงปัจจุบันเต็มหน่วย ต้นทุนแม่นยำ แนะนำราคาขายพร้อมคำนวณกำไรต่อชิ้นเพื่อให้ตั้งราคาขายได้ทันที`
                    });
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateAllDatabases();
            switchCategory('คุกกี้ & บราวนี่', document.querySelectorAll('.filter-tab-btn')[1]);
        });

        function switchCategory(categoryName, btnElement) {
            currentActiveCategory = categoryName;

            document.querySelectorAll('.filter-tab-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            document.getElementById('recipeSearchInput').value = "";
            document.getElementById('recipeSearchInput').placeholder = `🔍 พิมพ์ค้นหาเฉพาะในหมวด "${categoryName}"...`;
            document.getElementById('autocompleteDropdown').style.display = "none";

            displayRecipe(masterDatabase[categoryName][0]);
        }

        function onTypeSearch() {
            const keyword = document.getElementById('recipeSearchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('autocompleteDropdown');
            const currentList = masterDatabase[currentActiveCategory];

            if (keyword === "") {
                dropdown.style.display = "none";
                return;
            }

            const matched = currentList.filter(r => r.name.toLowerCase().includes(keyword)).slice(0, 15);

            if (matched.length === 0) {
                dropdown.style.display = "block";
                dropdown.innerHTML = `<div class="autocomplete-item" style="color: #aaa; cursor: default;">ไม่พบเมนูนี้ในหมวด ${currentActiveCategory} ❌</div>`;
                return;
            }

            dropdown.style.display = "block";
            dropdown.innerHTML = matched.map(item => `
                <div class="autocomplete-item" onclick="selectRecipe('${item.id}')">
                    ${item.name}
                    <span>${item.category}</span>
                </div>
            `).join('');
        }

        function selectRecipe(id) {
            const currentList = masterDatabase[currentActiveCategory];
            const found = currentList.find(r => r.id === id);
            if (found) {
                document.getElementById('recipeSearchInput').value = found.name;
                document.getElementById('autocompleteDropdown').style.display = "none";
                displayRecipe(found);
            }
        }

        window.addEventListener('click', function(e) {
            if (!e.target.closest('.search-autocomplete-wrapper') && !e.target.closest('.category-filter-tabs')) {
                document.getElementById('autocompleteDropdown').style.display = "none";
            }
        });

        function displayRecipe(item) {
            const container = document.getElementById('recipeDetailContainer');
            container.innerHTML = `
                <div class="recipe-display-card">
                    <div class="recipe-header-title">
                        <span>${item.name}</span>
                        <span class="recipe-category-tag">📂 ${item.category}</span>
                    </div>
                    
                    <div class="recipe-grid-details">
                        <div class="recipe-box-section">
                            <h4>📋 แจกแจงต้นทุนวัตถุดิบ (ราคาจริงปัจจุบัน)</h4>
                            <table class="ing-cost-table">
                                <thead>
                                    <tr>
                                        <th>รายการวัตถุดิบ / ส่วนประกอบ</th>
                                        <th class="price-col">ต้นทุน (บาท)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${item.ingredients.map(ing => `
                                        <tr>
                                            <td>${ing.name}</td>
                                            <td class="price-col">${ing.cost.toFixed(2)} ฿</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>

                            <h4 style="margin-top: 22px;">👩‍🍳 วิธีการทำอย่างละเอียด</h4>
                            <ol>
                                ${item.steps.map(step => `<li style="margin-bottom: 6px;">${step}</li>`).join('')}
                            </ol>
                        </div>

                        <div class="recipe-box-section" style="display: flex; flex-direction: column; justify-content: space-between;">
                            <div>
                                <h4>💡 กลยุทธ์การขาย & การตลาด</h4>
                                <div class="marketing-tips-box">
                                    <h5>แนวทางตั้งราคาขาย</h5>
                                    <p>${item.marketingTips}</p>
                                </div>
                            </div>
                            <div style="background: rgba(255, 42, 133, 0.08); border: 1px solid rgba(255, 42, 133, 0.3); padding: 16px; border-radius: 14px; text-align: center; margin-top: 15px;">
                                <span style="color: #ff758c; font-size: 0.9rem; display: block; margin-bottom: 4px;">🏷️ ราคาขายแนะนำ</span>
                                <strong style="color: #00ffcc; font-size: 1.4rem;">${item.sellingPriceText}</strong>
                            </div>
                        </div>
                    </div>

                    <div class="cost-summary-container">
                        <div class="master-cost-card">
                            <div class="card-main-title">📦 สรุปผลกำไรและต้นทุน (ระดับต่อชิ้น / หน่วย)</div>
                            <div class="sub-stat-grid-3">
                                <div class="stat-box">
                                    <span>ต้นทุนต่อชิ้น</span>
                                    <strong>${item.unitCostVal}</strong>
                                    <p>ปริมาณ: ${item.yieldText}</p>
                                </div>
                                <div class="stat-box price-box">
                                    <span>ราคาขายแนะนำ</span>
                                    <strong>${item.suggestedPriceVal}</strong>
                                    <p>ราคาต่อหน่วย</p>
                                </div>
                                <div class="stat-box profit-box">
                                    <span>กำไรสุทธิ</span>
                                    <strong>${item.estimatedProfitVal}</strong>
                                    <p>กำไรเต็มๆ ต่อชิ้น</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
